name: "Deploy | Develop Environment"

on:
  pull_request:
    types: [labeled]
    branches:
      - develop

permissions:
  statuses: write
  contents: read
  checks: write
  id-token: write

jobs:
  backend-run-tests:
    if: github.event_name == 'pull_request' && (github.event.label.name == 'deploy-to-develop' || github.event.label.name == 'deploy-dev-all')
    name: Backend - Run Tests
    uses: ./.github/workflows/run_tests.yml

  backend-setup-environment:
    name: Backend - Setup Environment
    needs: [backend-run-tests]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-develop-backend
      cancel-in-progress: false
    steps:
      - name: Verify authorized user for manual deploy
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.actor }}" != "krudny" ]; then
            echo "Error: User ${{ github.actor }} is not authorized to deploy to develop."
            exit 1
          fi

      - name: Reset develop and copy data from staging via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEVELOP_VM_IP }}
          username: ${{ secrets.DEVELOP_VM_USER }}
          key: ${{ secrets.DEVELOP_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export PGPASSWORD="${{ secrets.DEVELOP_DB_PASSWORD }}"
            psql -h localhost -p ${{ secrets.DEVELOP_DB_PORT }} -U "${{ secrets.DEVELOP_DB_USER }}" -d "${{ secrets.DEVELOP_DB_NAME }}" -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO ${{ secrets.DEVELOP_DB_USER }};"

            export PGPASSWORD="${{ secrets.STAGING_DB_PASSWORD }}"
            pg_dump -h localhost -p ${{ secrets.STAGING_DB_PORT }} -U "${{ secrets.STAGING_DB_USER }}" --no-owner --no-privileges "${{ secrets.STAGING_DB_NAME }}" | \
              PGPASSWORD="${{ secrets.DEVELOP_DB_PASSWORD }}" psql -h localhost -p ${{ secrets.DEVELOP_DB_PORT }} -U "${{ secrets.DEVELOP_DB_USER }}" -d "${{ secrets.DEVELOP_DB_NAME }}" -v ON_ERROR_STOP=1

  backend-migrate:
    name: Backend - Run Migrations
    needs: [backend-setup-environment]
    uses: ./.github/workflows/run_migrations.yml
    secrets:
      DB_HOST: ${{ secrets.DEVELOP_VM_IP }}
      DB_PORT: ${{ secrets.DEVELOP_DB_PORT }}
      DB_NAME: ${{ secrets.DEVELOP_DB_NAME }}
      DB_USER: ${{ secrets.DEVELOP_DB_USER }}
      DB_PASSWORD: ${{ secrets.DEVELOP_DB_PASSWORD }}
      VM_USER: ${{ secrets.DEVELOP_VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEVELOP_SSH_PRIVATE_KEY }}

  backend-build-push:
    name: Backend - Build and Push
    needs: [backend-setup-environment, backend-migrate]
    uses: ./.github/workflows/build_push.yml
    with:
      environment: develop
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      ARTIFACT_REGISTRY_NAME: ${{ secrets.ARTIFACT_REGISTRY_NAME }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

  backend-deploy:
    name: Backend - Deploy
    needs: [backend-build-push]
    uses: ./.github/workflows/deploy_to_env.yml
    with:
      environment: develop
      container-port: 8082
      health-check-delay: 550
    secrets:
      VM_IP: ${{ secrets.DEVELOP_VM_IP }}
      VM_USER: ${{ secrets.DEVELOP_VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEVELOP_SSH_PRIVATE_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      ARTIFACT_REGISTRY_NAME: ${{ secrets.ARTIFACT_REGISTRY_NAME }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
      HEALTH_ENDPOINT: ${{ secrets.HEALTH_ENDPOINT }}
      APP_DOMAIN: ${{ secrets.DEVELOP_APP_DOMAIN }}

  executor-deploy:
    if: github.event_name == 'pull_request' && (github.event.label.name == 'deploy-executor-dev' || github.event.label.name == 'deploy-dev-all')
    name: Executor - Deploy to Dev
    uses: ./.github/workflows/deploy_executor_dev.yml
    secrets: inherit
